[package]
name = "purbayalog"
version = "1.0.0"
description = "PurbayaLog - Logbook Aktivitas Mahasiswa Politeknik Purbaya"
authors = ["Politeknik Purbaya"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "purbayalog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
magang-core = { path = "../core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
